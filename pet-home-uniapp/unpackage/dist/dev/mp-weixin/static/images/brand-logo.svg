<?xml version="1.0" encoding="UTF-8"?>
<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景圆形 -->
  <circle cx="60" cy="60" r="60" fill="#ff6b35"/>

  <!-- 宠物爪印 -->
  <g transform="translate(30, 25)">
    <!-- 爪印主体 -->
    <ellipse cx="30" cy="35" rx="25" ry="30" fill="#fff"/>

    <!-- 爪垫 -->
    <circle cx="20" cy="25" r="8" fill="#ff6b35"/>
    <circle cx="30" cy="20" r="8" fill="#ff6b35"/>
    <circle cx="40" cy="25" r="8" fill="#ff6b35"/>
    <circle cx="30" cy="35" r="8" fill="#ff6b35"/>

    <!-- 指垫 -->
    <circle cx="15" cy="50" r="6" fill="#fff"/>
    <circle cx="25" cy="55" r="6" fill="#fff"/>
    <circle cx="35" cy="55" r="6" fill="#fff"/>
    <circle cx="45" cy="50" r="6" fill="#fff"/>
  </g>
</svg>
