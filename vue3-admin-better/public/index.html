  <body>
    <noscript
      >非常抱歉鉴于安全考量,您无法查看<%= VUE_APP_TITLE %>
      源代码，该系统基于vue-admin-better开发</noscript
    >
    <div id="vue-admin-better"></div>
    <script>
      // 注释掉访问限制检查，允许本地开发
      // /^http(s*):\/\//.test(location.href) ||
      //   alert("基于vue3 admin better 开源版开发的项目需要部署到服务器下访问");
      
      // 处理 ResizeObserver 错误
      window.addEventListener('error', function(e) {
        if (e.message && e.message.includes('ResizeObserver')) {
          e.preventDefault();
          e.stopImmediatePropagation();
          return false;
        }
      });
      
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && e.reason.message && e.reason.message.includes('ResizeObserver')) {
          e.preventDefault();
          return false;
        }
      });
      
      // 设置 dayjs 中文语言环境并确保插件正确加载
      window.addEventListener('DOMContentLoaded', function() {
        if (window.dayjs) {
          // 设置中文语言环境
          if (window.dayjs.locale) {
            window.dayjs.locale('zh-cn');
            console.log('dayjs locale set to zh-cn');
          }
          
          // 确保 add 方法可用
          if (!window.dayjs.prototype.add) {
            console.warn('dayjs add method not available, loading duration plugin');
            const script = document.createElement('script');
            script.src = 'https://cdn.jsdelivr.net/npm/dayjs@1.11.18/plugin/duration.js';
            script.onload = function() {
              console.log('dayjs duration plugin loaded');
              // 重新设置语言环境
              if (window.dayjs.locale) {
                window.dayjs.locale('zh-cn');
              }
            };
            document.head.appendChild(script);
          }
        }
      });
      
    </script>
    <script>
      if (window.location.hostname !== "localhost") {

          var s = document.getElementsByTagName("script")[0];
          s.parentNode.insertBefore(hm, s);
        })();
      }
    </script>
  </body>
