# 本地开发环境配置
# 启动方式：
#   --spring.profiles.active=local
# 或：
#   mvn spring-boot:run -Dspring-boot.run.profiles=local

server:
  address: 0.0.0.0
  port: 8080
  ssl:
    enabled: false

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/pet_home?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=GMT%2B8&connectionCollation=utf8mb4_unicode_ci
    username: root
    password: 123456
  redis:
    host: localhost
    port: 6379
    password:
    database: 0

# 本地访问地址
host: http://localhost:8080
domain: http://localhost:8080
app.public-base-url: http://localhost:8080

# 本地上传目录与访问前缀
upload:
  path: ./upload/
  url: http://localhost:8080/upload/
  http-url: http://localhost:8080/upload/

# 本地视频资源目录
video:
  upload-path: ./upload/videos
  base-url: http://localhost:8080/upload/videos

# 本地开发建议关闭外部AI调用
ai:
  enabled: false

