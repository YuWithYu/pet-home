# 宠物之家 - 本地开发配置
# 启动命令：mvn spring-boot:run

server:
  address: 0.0.0.0
  port: 8080
  servlet:
    context-path: /
  tomcat:
    uri-encoding: UTF-8
    # 调优：原 300s 过长，慢连接会长期占用工作线程，峰值时拖垮吞吐；收敛为 60s
    connection-timeout: 60000
    max-connections: 10000
    threads:
      max: 200
      min-spare: 10
  ssl:
    enabled: false

spring:
  application:
    name: pet-home-backend

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/pet_home?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=GMT%2B8&connectionCollation=utf8mb4_unicode_ci&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    hikari:
      # 连接池调优：默认 maximum-pool-size=10 与 Tomcat 200 线程严重不匹配，
      # 峰值时大量请求线程排队等连接，表现为整体卡顿而非报错。
      # 池大小经验值参考 CPU核数*2+有效磁盘数，混合读写负载 20 足够（并非越大越好）。
      maximum-pool-size: 20
      minimum-idle: 5
      # 3s 内拿不到连接快速失败，避免请求线程长时间挂起拖垮整体吞吐
      connection-timeout: 3000
      # 连接最大存活 30min，须小于 MySQL wait_timeout（默认 8h）
      max-lifetime: 1800000
      # 每 5min 保活探测，防止空闲连接被 MySQL/中间层静默断开
      keepalive-time: 300000
      pool-name: pet-home-hikari

  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: 0
    timeout: 6000ms
    lettuce:
      pool:
        max-active: 8
        max-wait: -1ms
        max-idle: 8
        min-idle: 0

  # RabbitMQ：订单超时延迟队列（队列级 TTL + 死信路由）。
  # 开关默认开启：本地 broker 由 scripts/start-infra.ps1 一键启动。
  # 未启动 broker 时可用 APP_MQ_ENABLED=false 关闭，系统自动降级为 @Scheduled 扫表 + Redis，功能不受影响。
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        auto-startup: ${APP_MQ_ENABLED:true}

  # Kafka：行为埋点管道（消费端手动提交偏移）
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
    charset: UTF-8

  servlet:
    multipart:
      # 安全修复：原 500MB/1000MB 上限过大，匿名可达的上传链路易被打满磁盘/带宽；
      # 全局上限收紧为 200MB（容纳视频），图片在 FileUploadUtil 中另有 10MB 分级限制。
      max-file-size: 200MB
      max-request-size: 210MB
      enabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    auto-mapping-behavior: full
    # 安全修复：原为 StdOutImpl 会把所有 SQL（含敏感字段查询）打印到控制台，污染日志且可能泄露敏感数据。
    # 改为 Slf4jImpl 走标准日志框架，并可通过 logging.level 控制（生产环境调到 WARN/INFO）。
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  # 安全提示：HS512 要求密钥至少 64 字节（512 位）。
  # 本地开发使用固定密钥；生产环境必须改用环境变量 JWT_SECRET 注入随机 64+ 字节密钥。
  secret: ${JWT_SECRET:pet-home-local-dev-secret-key-please-change-in-production-2024-0123456789abcdef}
  expiration: 7200

wechat:
  pay:
    # 安全修复：移除真实 app-id/mch-id 的默认值（真实商户标识曾随源码提交入库），
    # 一律通过环境变量注入
    app-id: ${WECHAT_PAY_APP_ID:}
    mch-id: ${WECHAT_PAY_MCH_ID:}
    api-key: ${WECHAT_PAY_API_KEY:}
    notify-url: ${WECHAT_PAY_NOTIFY_URL:http://localhost:8080/api/payment/notify}
    sandbox: false
    cert-path: ${WECHAT_PAY_CERT_PATH:./certs/apiclient_cert.p12}
    # 安全提示：生产环境必须用环境变量注入，禁止硬编码
    cert-password: ${WECHAT_PAY_CERT_PASSWORD:}
    # 模拟支付通道（无商户凭证的本地联调用）：默认关闭，生产部署不设此变量即走真实微信支付
    mock-enabled: ${WECHAT_PAY_MOCK_ENABLED:false}
  miniapp:
    app-id: ${WECHAT_MINIAPP_APP_ID:}
    secret: ${WECHAT_MINIAPP_SECRET:}

logging:
  level:
    com.pethome: debug

host: http://localhost:8080
domain: http://localhost:8080
app:
  public-base-url: http://localhost:8080
  # CORS 来源白名单（逗号分隔，支持通配符）。
  # 安全修复：原 CorsConfig/SecurityConfig 均为 allowedOriginPatterns("*") 全放开；
  # 现收敛为单一配置点，默认仅放行本地开发地址，生产环境通过 APP_CORS_ALLOWED_ORIGINS 注入真实域名。
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  # 消息中间件开关
  # mq（RabbitMQ）：默认开启，本地 broker 由 scripts/start-infra.ps1 一键启动（Erlang + RabbitMQ 已在 infra/ 内置）
  # kafka：本地已内置 KRaft broker（scripts/start-infra.ps1 一键启动），默认开启
  mq:
    enabled: ${APP_MQ_ENABLED:true}
    outbox-max-retry: 6
  kafka:
    enabled: ${APP_KAFKA_ENABLED:true}
    topic:
      post-view: ${APP_KAFKA_POST_VIEW_TOPIC:pethome.behavior.post-view}

upload:
  path: ./upload/
  url: http://localhost:8080/upload/
  http-url: http://localhost:8080/upload/
  image:
    compress: true
    max-width: 1024
    max-height: 1024
    quality: 0.75
  video:
    transcode:
      enabled: false

video:
  upload-path: ./upload/videos
  base-url: http://localhost:8080/upload/videos

logistics:
  kuaidi100:
    enabled: false
    customer: your_customer_key
    key: your_api_key

ai:
  enabled: false

sms:
  aliyun:
    enabled: false
    access-key-id: ${ALIBABA_CLOUD_ACCESS_KEY_ID:}
    access-key-secret: ${ALIBABA_CLOUD_ACCESS_KEY_SECRET:}
    sign-name: 验证码
    template-code: "SMS_xxxxxx"

# 健康检查端点（供 Nginx / 宝塔 / K8s 探活）：仅暴露 health，不暴露 env/heapdump 等敏感端点
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    # 项目仅在实体上使用 ES 注解，未实现检索仓库；本地/演示环境也不部署 Elasticsearch。
    # 不禁用该指标会让 /actuator/health 恒为 DOWN(503)，Nginx/K8s 探活失效。
    elasticsearch:
      enabled: false

# API 文档：springfox 已停止维护且与 Boot 2.7 存在兼容性问题，迁移至 springdoc-openapi
# 安全：默认关闭（会暴露全部接口结构），本地联调需要时显式设置 SWAGGER_ENABLED=true
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
